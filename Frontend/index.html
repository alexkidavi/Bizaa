<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 🔥 Primary SEO -->
    <title>Bizaa POS - Point of Sale, Inventory & Business Management Software</title>
    <meta
      name="description"
      content="Bizaa POS is an all-in-one point of sale, inventory, HRM, purchasing and analytics platform built for businesses in Kenya and East Africa. Manage sales, stock, branches, staff and reports from one simple dashboard — start a free 14-day trial, no card required."
    />
    <meta
      name="keywords"
      content="Bizaa, Bizaa POS, POS system Kenya, point of sale software, inventory management system, retail POS, stock management software, business management software, HRM software Kenya, multi-branch POS, East Africa POS system"
    />
    <meta name="author" content="Bizaa POS by Brimsoft Solutions" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#229de7" />
    <meta name="color-scheme" content="light" />

    <!-- 🔥 Canonical URL -->
    <link rel="canonical" href="https://bripos.brimsoftsolutions.com/" />

    <!-- 🔥 Favicons / app icons -->
    <!-- ?v=2 cache-busts the browser's aggressive favicon cache — bump this
         query string any time the favicon image itself changes again;
         changing the <link> tags alone is not enough, browsers keep
         serving whatever they first fetched from a given URL. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=3" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- 🔥 Open Graph (Facebook / WhatsApp / LinkedIn) -->
    <meta property="og:site_name" content="Bizaa POS" />
    <meta property="og:title" content="Bizaa POS - One Platform. Every Part of Your Business, Covered." />
    <meta
      property="og:description"
      content="POS, inventory, HRM, purchases and analytics in one fast, simple platform. Designed for the way businesses actually operate in Kenya and beyond."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://bripos.brimsoftsolutions.com/" />
    <meta property="og:image" content="https://bripos.brimsoftsolutions.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bizaa POS logo" />

    <!-- 🔥 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bizaa POS - One Platform. Every Part of Your Business, Covered." />
    <meta
      name="twitter:description"
      content="POS, inventory, HRM, purchases and analytics in one fast, simple platform for businesses in Kenya and East Africa."
    />
    <meta name="twitter:image" content="https://bripos.brimsoftsolutions.com/og-image.png" />

    <!-- 🔥 Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Bizaa POS",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, Android, iOS",
        "description": "All-in-one point of sale, inventory, HRM, purchasing and analytics platform for businesses in Kenya and East Africa.",
        "url": "https://bripos.brimsoftsolutions.com/",
        "image": "https://bripos.brimsoftsolutions.com/og-image.png",
        "offers": {
          "@type": "Offer",
          "priceCurrency": "KES",
          "description": "14-day free trial, no card required"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Brimsoft Solutions"
        }
      }
    </script>

    <!-- 🔥 Fonts -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />

    <!--
      Chart.js and PrimeVue/PrimeIcons were previously also loaded here via
      unpinned CDN URLs (no version pin, no SRI) — removed: Chart.js is
      already imported from the npm package (src/pages/Dashboard/Dashboard.vue),
      making the CDN copy a competing duplicate global; primevue/primeicons
      are listed in package.json but have zero imports/usage anywhere in
      src/, so both the CDN tags and the npm packages were dead weight.
      `npm uninstall primevue primeicons` to finish removing them.
    -->
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
