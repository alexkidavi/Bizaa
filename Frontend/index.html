<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 🔥 Primary SEO -->
    <title>Bizaa - Modern POS & Inventory Management System</title>
    <meta name="description" content="Bizaa is a modern Point of Sale (POS) and inventory management system designed for businesses to manage sales, stock, branches, and reports efficiently." />
    <meta name="keywords" content="POS system, inventory management, Bizaa, sales system, stock management, business software, retail POS" />
    <meta name="author" content="Bizaa" />

    <!-- 🔥 Canonical URL (change to your domain) -->
    <link rel="canonical" href="https://bripos.brimsoftsolutions.com/" />

    <!-- 🔥 Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- 🔥 Open Graph (Facebook / WhatsApp) -->
    <meta property="og:title" content="Bizaa - Modern POS System" />
    <meta property="og:description" content="Manage your sales, inventory, and branches with Bizaa — a fast and modern POS system." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bripos.brimsoftsolutions.com/" />
    <meta property="og:image" content="https://bripos.brimsoftsolutions.com/preview.png" />

    <!-- 🔥 Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bizaa - POS System" />
    <meta name="twitter:description" content="Modern POS and inventory management system for businesses." />
    <meta name="twitter:image" content="https://bripos.brimsoftsolutions.com/preview.png" />

    <!-- 🔥 Fonts -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />

    <!--
      Chart.js and PrimeVue/PrimeIcons were previously also loaded here via
      unpinned CDN URLs (no version pin, no SRI) — removed: Chart.js is
      already imported from the npm package (src/pages/Dashboard/Dashboard.vue),
      making the CDN copy a competing duplicate global; primevue/primeicons
      are listed in package.json but have zero imports/usage anywhere in
      src/, so both the CDN tags and the npm packages were dead weight.
      `npm uninstall primevue primeicons` to finish removing them.
    -->

    <!-- 🔥 Performance hint -->
    <meta name="theme-color" content="#0f172a" />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
