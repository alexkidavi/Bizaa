; Supervisor config for the Bizaa Laravel queue worker.
;
; Without this running continuously, nothing on the `database` queue
; connection ever executes: CRM campaign sends (App\Jobs\SendCrmCampaignRecipientJob,
; dispatched as a Bus::batch by CrmCampaignService::send()) and report
; exports (App\Jobs\GenerateReportExportJob, dispatched by
; ReportExportController::store()) both just sit in the `jobs` table
; forever with no worker to run `php artisan queue:work`.
;
; Install:
;   1. Copy this file to /etc/supervisor/conf.d/bizaa-worker.conf on the
;      production host (adjust `directory`, `user`, and PHP binary path
;      for your server).
;   2. supervisorctl reread && supervisorctl update && supervisorctl start bizaa-worker:*
;
; After every deploy that changes job/handler code, queued workers are
; still running the OLD code in memory until restarted:
;   php artisan queue:restart
; (gracefully finishes the current job on each worker, then exits so
; Supervisor respawns it with the new code — add this to your deploy script)

[program:bizaa-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/bizaa/backend/artisan queue:work --queue=default --sleep=1 --tries=3 --max-time=3600
directory=/var/www/bizaa/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/bizaa/backend/storage/logs/worker.log
stopwaitsecs=3600
